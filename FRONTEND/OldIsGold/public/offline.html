<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#1d6b4d" />
  <title>You're offline | CampusMart</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f3ec; color: #18382b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 480px); padding: 36px; border: 1px solid #dce6dd; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgb(18 50 35 / 9%); }
    .mark { display: grid; width: 52px; height: 52px; place-items: center; margin-bottom: 24px; border-radius: 16px; background: #1d6b4d; color: #fff; font-size: 30px; font-weight: 800; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 7vw, 2.4rem); }
    p { color: #53645a; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    a, button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; border: 0; border-radius: 999px; background: #1d6b4d; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    a.secondary { background: #edf3ed; color: #18382b; }
    :focus-visible { outline: 3px solid #a2c64e; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">C</div>
    <p>CampusMart connection</p>
    <h1>You're offline</h1>
    <p>CampusMart couldn't reach the network. Your account data and requests are not stored for offline use. Reconnect, then retry any action that did not finish.</p>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">Try again</button>
      <a class="secondary" href="/">CampusMart home</a>
    </div>
  </main>
</body>
</html>
